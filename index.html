<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>議事録</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #e8ff47;
    --accent2: #47ffe8;
    --text: #f0f0f0;
    --text-muted: #666;
    --text-dim: #999;
    --danger: #ff4747;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  .screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }
  .screen.active { display: flex; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 52px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .header-title { font-size: 20px; font-weight: 700; }
  .header-title span { color: var(--accent); }

  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 20px;
    -webkit-appearance: none;
    appearance: none;
  }

  .rec-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    gap: 20px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-muted);
    min-height: 24px;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .status-dot.recording {
    background: var(--danger);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .transcript-area {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    overflow-y: auto;
    min-height: 180px;
    position: relative;
  }
  .placeholder { color: var(--text-muted); font-size: 14px; line-height: 1.8; }
  #transcript-text {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .interim { color: var(--text-dim); font-style: italic; }

  .rec-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .timer {
    font-size: 32px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .timer.recording { color: var(--danger); }

  .rec-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
  }
  .rec-btn-inner {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--accent);
    transition: border-radius 0.2s, width 0.2s, height 0.2s;
    pointer-events: none;
  }
  .rec-btn.recording { border-color: var(--danger); }
  .rec-btn.recording .rec-btn-inner {
    background: var(--danger);
    border-radius: 12px;
    width: 44px;
    height: 44px;
  }

  .rec-label { font-size: 14px; color: var(--text-muted); }

  .save-btn {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #000;
    font-size: 16px;
    font-weight: 700;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .save-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .list-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 40px;
  }
  .empty-icon { font-size: 52px; }
  .empty-state p { font-size: 14px; line-height: 1.7; }

  .memo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
  }
  .memo-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .memo-date { font-size: 13px; color: var(--accent); font-weight: 500; }
  .memo-actions { display: flex; gap: 8px; }
  .memo-action-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
  }
  .memo-action-btn.mail { color: var(--accent2); border-color: var(--accent2); }
  .memo-action-btn.del  { color: var(--danger);  border-color: var(--danger);  }
  .memo-preview {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .memo-chars { font-size: 12px; color: var(--text-muted); }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .detail-meta { font-size: 13px; color: var(--accent); margin-bottom: 16px; font-weight: 500; }
  .detail-text {
    font-size: 16px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .detail-footer {
    padding: 16px 20px 32px;
    border-top: 1px solid var(--border);
  }
  .mail-btn {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--accent2);
    background: transparent;
    color: var(--accent2);
    font-size: 16px;
    font-weight: 500;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  .settings-body {
    flex: 1;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .setting-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .setting-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 16px;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .setting-input:focus { border-color: var(--accent); }
  .setting-hint { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-top: 8px; }
  .settings-save-btn {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #000;
    font-size: 16px;
    font-weight: 700;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  .bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding-bottom: 20px;
  }
  .nav-btn {
    flex: 1;
    padding: 12px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    -webkit-appearance: none;
    appearance: none;
  }
  .nav-btn .nav-icon { font-size: 24px; }
  .nav-btn.active { color: var(--accent); }

  .dialog-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 50;
    align-items: flex-end;
  }
  .dialog-overlay.show { display: flex; }
  .dialog {
    width: 100%;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .dialog-title { font-size: 17px; font-weight: 700; text-align: center; }
  .dialog-msg { font-size: 14px; color: var(--text-dim); text-align: center; line-height: 1.6; }
  .dialog-btns { display: flex; gap: 10px; }
  .dialog-btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .dialog-btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    font-weight: 700;
  }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 録音画面 -->
<div class="screen active" id="screen-rec">
  <div class="header">
    <div class="header-title">議事録<span>●</span></div>
    <button class="icon-btn" id="btn-settings-from-rec" type="button">⚙️</button>
  </div>
  <div class="rec-body">
    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label">録音待機中</span>
    </div>
    <div class="transcript-area" id="transcript-area">
      <div class="placeholder" id="placeholder">録音ボタンを押して話してください。<br>日本語で話した内容がリアルタイムで表示されます。</div>
      <div id="transcript-text"></div>
    </div>
    <div class="rec-center">
      <div class="timer" id="timer">00:00</div>
      <button class="rec-btn" id="rec-btn" type="button">
        <div class="rec-btn-inner"></div>
      </button>
      <span class="rec-label" id="rec-label">タップして録音開始</span>
    </div>
    <button class="save-btn" id="save-btn" type="button" disabled>📝 議事録を保存する</button>
  </div>
</div>

<!-- 一覧画面 -->
<div class="screen" id="screen-list">
  <div class="header">
    <div class="header-title">議事録<span>一覧</span></div>
    <button class="icon-btn" id="btn-settings-from-list" type="button">⚙️</button>
  </div>
  <div class="list-body" id="list-body"></div>
</div>

<!-- 詳細画面 -->
<div class="screen" id="screen-detail">
  <div class="header">
    <button class="icon-btn" id="btn-detail-back" type="button">←</button>
    <div class="header-title">詳細</div>
    <div style="width:44px"></div>
  </div>
  <div class="detail-body">
    <div class="detail-meta" id="detail-meta"></div>
    <div class="detail-text" id="detail-text"></div>
  </div>
  <div class="detail-footer">
    <button class="mail-btn" id="detail-mail-btn" type="button">✉️ メールで送信</button>
  </div>
</div>

<!-- 設定画面 -->
<div class="screen" id="screen-settings">
  <div class="header">
    <button class="icon-btn" id="btn-settings-back" type="button">←</button>
    <div class="header-title">設定</div>
    <div style="width:44px"></div>
  </div>
  <div class="settings-body">
    <div>
      <div class="setting-label">送信先メールアドレス</div>
      <input type="email" class="setting-input" id="email-input" placeholder="example@mail.com" inputmode="email" autocomplete="email">
      <div class="setting-hint">議事録をメール送信する際の宛先です。</div>
    </div>
    <button class="settings-save-btn" id="btn-settings-save" type="button">保存する</button>
  </div>
</div>

<!-- ボトムナビ -->
<div class="bottom-nav" id="bottom-nav">
  <button class="nav-btn active" id="nav-rec" type="button">
    <span class="nav-icon">🎙️</span>録音
  </button>
  <button class="nav-btn" id="nav-list" type="button">
    <span class="nav-icon">📋</span>一覧
  </button>
</div>

<!-- 削除確認ダイアログ -->
<div class="dialog-overlay" id="delete-dialog">
  <div class="dialog">
    <div class="dialog-title">削除の確認</div>
    <div class="dialog-msg">この議事録を削除しますか？<br>この操作は取り消せません。</div>
    <div class="dialog-btns">
      <button class="dialog-btn" id="btn-dialog-cancel" type="button">キャンセル</button>
      <button class="dialog-btn danger" id="btn-dialog-confirm" type="button">削除する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var recognition = null;
var isRecording = false;
var finalText = '';
var timerInterval = null;
var seconds = 0;
var currentScreen = 'screen-rec';
var prevScreen = 'screen-rec';
var deleteTargetId = null;
var currentDetailId = null;

function addTap(id, fn) {
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchend', function(e) { e.preventDefault(); fn(); });
  el.addEventListener('click', fn);
}

window.onload = function() {
  addTap('nav-rec',              function() { switchTab('rec'); });
  addTap('nav-list',             function() { switchTab('list'); });
  addTap('btn-settings-from-rec',function() { showScreen('screen-settings'); });
  addTap('btn-settings-from-list',function() { showScreen('screen-settings'); });
  addTap('btn-detail-back',      function() { showScreen('screen-list'); });
  addTap('btn-settings-back',    function() { goBack(); });
  addTap('rec-btn',              function() { toggleRecording(); });
  addTap('save-btn',             function() { saveMemo(); });
  addTap('btn-settings-save',    function() { saveSettings(); });
  addTap('btn-dialog-cancel',    function() { closeDialog(); });
  addTap('btn-dialog-confirm',   function() { confirmDelete(); });
  addTap('detail-mail-btn',      function() { if (currentDetailId) sendMail(currentDetailId); });
};

function showScreen(id) {
  prevScreen = currentScreen;
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  currentScreen = id;
  var hideNav = (id === 'screen-detail' || id === 'screen-settings');
  document.getElementById('bottom-nav').style.display = hideNav ? 'none' : 'flex';
  document.getElementById('nav-rec').classList.toggle('active', id === 'screen-rec');
  document.getElementById('nav-list').classList.toggle('active', id === 'screen-list');
  if (id === 'screen-list') renderList();
  if (id === 'screen-settings') loadSettings();
}

function switchTab(tab) {
  showScreen(tab === 'rec' ? 'screen-rec' : 'screen-list');
}

function goBack() {
  showScreen(prevScreen === 'screen-settings' ? 'screen-rec' : prevScreen);
}

function toggleRecording() {
  if (isRecording) stopRecording();
  else startRecording();
}

function startRecording() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('このブラウザは音声認識に非対応です');
    return;
  }
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = function() {
    isRecording = true;
    updateRecUI(true);
    startTimer();
  };

  recognition.onresult = function(e) {
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { finalText += t; }
      else { interim = t; }
    }
    renderTranscript(interim);
  };

  recognition.onerror = function(e) {
    if (e.error === 'no-speech') return;
    showToast('認識エラー: ' + e.error);
    stopRecording();
  };

  recognition.onend = function() {
    if (isRecording) { try { recognition.start(); } catch(ex) {} }
  };

  finalText = '';
  document.getElementById('transcript-text').innerHTML = '';
  document.getElementById('placeholder').style.display = 'none';
  recognition.start();
}

function stopRecording() {
  isRecording = false;
  if (recognition) {
    recognition.onend = null;
    recognition.stop();
    recognition = null;
  }
  stopTimer();
  updateRecUI(false);
  renderTranscript('');
  var has = finalText.trim().length > 0;
  document.getElementById('save-btn').disabled = !has;
  if (!has) document.getElementById('placeholder').style.display = 'block';
}

function updateRecUI(rec) {
  document.getElementById('rec-btn').classList.toggle('recording', rec);
  document.getElementById('status-dot').classList.toggle('recording', rec);
  document.getElementById('status-label').textContent = rec ? '録音中...' : '録音待機中';
  document.getElementById('rec-label').textContent = rec ? 'タップして停止' : 'タップして録音開始';
  document.getElementById('timer').classList.toggle('recording', rec);
}

function renderTranscript(interim) {
  var el = document.getElementById('transcript-text');
  el.innerHTML = esc(finalText) + (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
  el.parentElement.scrollTop = el.parentElement.scrollHeight;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function startTimer() {
  seconds = 0;
  updateTimerDisplay();
  timerInterval = setInterval(function() { seconds++; updateTimerDisplay(); }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  seconds = 0;
  document.getElementById('timer').textContent = '00:00';
}
function updateTimerDisplay() {
  var m = String(Math.floor(seconds / 60)).padStart(2,'0');
  var s = String(seconds % 60).padStart(2,'0');
  document.getElementById('timer').textContent = m + ':' + s;
}

function saveMemo() {
  var text = finalText.trim();
  if (!text) return;
  var now = new Date();
  var id = now.getTime().toString();
  var title = formatDate(now);
  var memos = getMemos();
  memos.unshift({ id: id, title: title, text: text, createdAt: now.toISOString() });
  localStorage.setItem('memos', JSON.stringify(memos));
  finalText = '';
  document.getElementById('transcript-text').innerHTML = '';
  document.getElementById('placeholder').style.display = 'block';
  document.getElementById('save-btn').disabled = true;
  stopTimer();
  showToast('✅ 保存しました');
}

function formatDate(d) {
  var y = d.getFullYear();
  var mo = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  var h = String(d.getHours()).padStart(2,'0');
  var mi = String(d.getMinutes()).padStart(2,'0');
  return y+'-'+mo+'-'+day+' '+h+':'+mi;
}

function getMemos() {
  try { return JSON.parse(localStorage.getItem('memos') || '[]'); } catch(e) { return []; }
}

function renderList() {
  var memos = getMemos();
  var body = document.getElementById('list-body');
  if (memos.length === 0) {
    body.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>保存された議事録はありません。<br>録音画面から作成してください。</p></div>';
    return;
  }
  body.innerHTML = memos.map(function(m) {
    return '<div class="memo-card" data-id="'+m.id+'">' +
      '<div class="memo-card-top">' +
      '<div class="memo-date">'+m.title+'</div>' +
      '<div class="memo-actions">' +
      '<button class="memo-action-btn mail" data-mail="'+m.id+'" type="button">✉️</button>' +
      '<button class="memo-action-btn del" data-del="'+m.id+'" type="button">🗑️</button>' +
      '</div></div>' +
      '<div class="memo-preview">'+esc(m.text)+'</div>' +
      '<div class="memo-chars">'+m.text.length+'文字</div>' +
      '</div>';
  }).join('');

  body.querySelectorAll('.memo-card').forEach(function(card) {
    var id = card.getAttribute('data-id');
    card.addEventListener('touchend', function(e) {
      if (e.target.closest('.memo-actions')) return;
      e.preventDefault(); openDetail(id);
    });
    card.addEventListener('click', function(e) {
      if (e.target.closest('.memo-actions')) return;
      openDetail(id);
    });
  });
  body.querySelectorAll('[data-mail]').forEach(function(btn) {
    var id = btn.getAttribute('data-mail');
    btn.addEventListener('touchend', function(e) { e.preventDefault(); e.stopPropagation(); sendMail(id); });
    btn.addEventListener('click', function(e) { e.stopPropagation(); sendMail(id); });
  });
  body.querySelectorAll('[data-del]').forEach(function(btn) {
    var id = btn.getAttribute('data-del');
    btn.addEventListener('touchend', function(e) { e.preventDefault(); e.stopPropagation(); askDelete(id); });
    btn.addEventListener('click', function(e) { e.stopPropagation(); askDelete(id); });
  });
}

function openDetail(id) {
  var memos = getMemos();
  var m = null;
  for (var i = 0; i < memos.length; i++) { if (memos[i].id === id) { m = memos[i]; break; } }
  if (!m) return;
  currentDetailId = id;
  document.getElementById('detail-meta').textContent = m.title;
  document.getElementById('detail-text').textContent = m.text;
  showScreen('screen-detail');
}

function sendMail(id) {
  var email = localStorage.getItem('email') || '';
  if (!email) { showToast('設定画面でメールアドレスを登録してください'); return; }
  var memos = getMemos();
  var m = null;
  for (var i = 0; i < memos.length; i++) { if (memos[i].id === id) { m = memos[i]; break; } }
  if (!m) return;
  var content = '■ 議事録\n日時：' + m.title + '\n\n' + m.text + '\n\n---\n議事録アプリより送信';
  var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '議事録_' + m.title.replace(/[: ]/g,'-') + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setTimeout(function() {
    var subject = encodeURIComponent('【議事録】' + m.title);
    var body = encodeURIComponent(content);
    window.location.href = 'mailto:' + email + '?subject=' + subject + '&body=' + body;
  }, 600);
  showToast('✉️ メールアプリを開いています...');
}

function askDelete(id) {
  deleteTargetId = id;
  document.getElementById('delete-dialog').classList.add('show');
}
function closeDialog() {
  deleteTargetId = null;
  document.getElementById('delete-dialog').classList.remove('show');
}
function confirmDelete() {
  if (!deleteTargetId) return;
  var memos = getMemos().filter(function(m) { return m.id !== deleteTargetId; });
  localStorage.setItem('memos', JSON.stringify(memos));
  closeDialog(); renderList();
  showToast('🗑️ 削除しました');
}

function loadSettings() {
  document.getElementById('email-input').value = localStorage.getItem('email') || '';
}
function saveSettings() {
  var email = document.getElementById('email-input').value.trim();
  localStorage.setItem('email', email);
  showToast('✅ 設定を保存しました');
  goBack();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
